services:
  - type: web
    name: linastyle-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://linastyle-api.onrender.com/api
  - type: web
    name: linastyle-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linastyle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://my-store-ten-phi.vercel.app,https://linastyle.shop,https://www.linastyle.shop
      - key: STORE_CURRENCY
        value: NGN
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
databases:
  - name: linastyle-db
    region: frankfurt
    plan: free
    databaseName: linastyle
    user: linastyle
