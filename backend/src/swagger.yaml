openapi: "3.0.3"
info:
  title: LinaStyledYou API
  description: |
    REST API for the **LinaStyledYou** single-seller e-commerce store.
    Customers browse products, manage a bag, authenticate, place stock-validated
    orders, and pay via Paystack.  Admins manage the product catalog, orders,
    customers, staff, and store settings.
  version: "1.0.0"
  contact:
    email: kehindelina@gmail.com

servers:
  - url: http://localhost:4000/api
    description: Local development

tags:
  - name: Health
    description: Server health check
  - name: Auth
    description: Registration, login, password reset
  - name: Catalog
    description: Public product & category browsing
  - name: Reviews & Comments
    description: Product reviews and Q&A
  - name: Cart
    description: Authenticated shopping cart
  - name: Orders
    description: Place and manage customer orders
  - name: Payments
    description: Payment initialization, verification, and confirmation
  - name: Support
    description: Contact messages
  - name: "Admin: Dashboard"
    description: Admin dashboard analytics
  - name: "Admin: Products"
    description: Admin product catalog CRUD
  - name: "Admin: Orders"
    description: Admin order management
  - name: "Admin: Customers"
    description: Admin customer management
  - name: "Admin: Staff"
    description: Owner-level staff management
  - name: "Admin: Categories"
    description: Admin category management
  - name: "Admin: Settings"
    description: Admin store settings
  - name: "Admin: Payment Confirmations"
    description: Review manual payment confirmations

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/register

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
        token:
          type: string
          description: JWT for a verified user

    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [customer, employee, admin, owner]
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            type: string

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    ProductSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        size_guide:
          type: string
        price:
          type: number
        discount_price:
          type: number
          nullable: true
        stock:
          type: integer
        sku:
          type: string
        brand:
          type: string
          nullable: true
        featured:
          type: boolean
        new_arrival:
          type: boolean
        best_seller:
          type: boolean
        active:
          type: boolean
        rating:
          type: number
        category_name:
          type: string
        category_slug:
          type: string
        image:
          type: string
        sizes:
          type: array
          description: Admin product list and write responses include active size variants.
          items:
            $ref: "#/components/schemas/Variant"
        created_at:
          type: string
          format: date-time

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            images:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  product_id:
                    type: string
                    format: uuid
                  url:
                    type: string
                  alt:
                    type: string
                    nullable: true
                  position:
                    type: integer
            variants:
              type: array
              items:
                $ref: "#/components/schemas/Variant"

    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        name:
          type: string
        options:
          type: object
        price:
          type: number
          nullable: true
        stock:
          type: integer
        sku:
          type: string
          nullable: true

    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cart_id:
          type: string
          format: uuid
        quantity:
          type: integer
        variant_id:
          type: string
          format: uuid
          nullable: true
        variant_name:
          type: string
          nullable: true
        variant_options:
          type: object
          nullable: true
        product_id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
        discount_price:
          type: number
          nullable: true
        stock:
          type: integer
        available:
          type: boolean
        sku:
          type: string
        image:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_payment, paid, processing, shipped, delivered, cancelled, refunded]
        payment_status:
          type: string
          enum: [pending, paid]
        subtotal:
          type: number
        shipping_cost:
          type: number
        total:
          type: number
        shipping_address:
          type: object
        tracking_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    OrderWithItems:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            customer_name:
              type: string
            customer_email:
              type: string
            items:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  product_id:
                    type: string
                    format: uuid
                  variant_id:
                    type: string
                    format: uuid
                    nullable: true
                  name:
                    type: string
                  quantity:
                    type: integer
                  unit_price:
                    type: number

    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rating:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time
        name:
          type: string

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    PaymentConfirmation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        payer_name:
          type: string
        amount:
          type: number
        reference:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        total_spending:
          type: number
        orders:
          type: integer

    StaffMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, owner]
        created_at:
          type: string
          format: date-time

    Dashboard:
      type: object
      properties:
        sales:
          type: number
        orders:
          type: object
          properties:
            total:
              type: integer
            pending:
              type: integer
            delivered:
              type: integer
        customers:
          type: integer
        products:
          type: integer
        lowStock:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              stock:
                type: integer
        recentOrders:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
              total:
                type: number
              created_at:
                type: string
                format: date-time

    StoreSettings:
      type: object
      properties:
        store_name:
          type: string
        tag_line:
          type: string
        logo_url:
          type: string
        contact_email:
          type: string
        phone:
          type: string
        whatsapp_number:
          type: string
        instagram_url:
          type: string
        tiktok_url:
          type: string
        whatsapp_message:
          type: string
        currency:
          type: string
        shipping_message:
          type: string
        bank_name:
          type: string
        bank_account_number:
          type: string
        bank_account_name:
          type: string

paths:
  # ─── Health ───
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  # ─── Public Settings ───
  /settings:
    get:
      tags: [Health]
      summary: Get public store settings
      responses:
        "200":
          description: Store settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"

  # ─── Auth ───
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an unverified customer account and email a verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Account created; follow the nextStep instructions to verify it before signing in
          content:
            application/json:
              schema:
                type: object
                required: [user, userId, message, nextStep]
                properties:
                  user:
                    $ref: "#/components/schemas/UserPublic"
                  userId:
                    type: string
                    format: uuid
                  message:
                    type: string
                  nextStep:
                    type: object
                    properties:
                      action:
                        type: string
                        example: verify_email
                      method:
                        type: string
                        example: POST
                      endpoint:
                        type: string
                        example: /auth/verifyemail
                      body:
                        type: object
                        properties:
                          userId:
                            type: string
                            format: uuid
                          otp:
                            type: string
                            example: "<6-digit code from your email>"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Email address has not been verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verifyemail:
    post:
      tags: [Auth]
      summary: Verify an account using the OTP sent by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, otp]
              properties:
                userId:
                  type: string
                  format: uuid
                otp:
                  type: string
                  pattern: "^\\d{6}$"
      responses:
        "200":
          description: Email verified; the user may now sign in
        "400":
          description: Invalid, expired, or already-used OTP
        "422":
          description: Invalid request body

  /auth/resendverification:
    post:
      tags: [Auth]
      summary: Resend an email verification OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Generic response to avoid account enumeration
        "422":
          description: Invalid request body

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserPublic"
        "401":
          description: Not authenticated
    patch:
      tags: [Auth]
      summary: Update display name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        "200":
          description: Name updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserPublic"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Generate a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Generic response to prevent account enumeration. In development, the OTP is written to the server terminal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with a one-time passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, password]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: "^\\d{6}$"
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (no-op, client removes token)
      responses:
        "204":
          description: Logged out

  # ─── Catalog ───
  /categories:
    get:
      tags: [Catalog]
      summary: List active categories
      responses:
        "200":
          description: Array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products:
    get:
      tags: [Catalog]
      summary: List active products with search, filter, sort
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search across name, description, SKU, category
        - name: category
          in: query
          schema:
            type: string
          description: Category slug filter
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, popular, rating]
            default: newest
          description: Sort order
      responses:
        "200":
          description: Array of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSummary"

  /products/{id}:
    get:
      tags: [Catalog]
      summary: Get single product with images and variants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Reviews & Comments ───
  /products/{id}/reviews:
    get:
      tags: [Reviews & Comments]
      summary: List approved reviews for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      tags: [Reviews & Comments]
      summary: Submit a review (must have purchased the product)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, body]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                body:
                  type: string
                  minLength: 3
                  maxLength: 2000
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "403":
          description: Not a verified purchaser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{id}/comments:
    get:
      tags: [Reviews & Comments]
      summary: List approved comments/questions for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      tags: [Reviews & Comments]
      summary: Post a question or comment on a product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 2
                  maxLength: 2000
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ─── Cart ───
  /cart:
    get:
      tags: [Cart]
      summary: Get cart items
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of cart items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItem"
    delete:
      tags: [Cart]
      summary: Clear entire cart
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Cart cleared

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                variantId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Item added
        "404":
          description: Product unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not enough stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /cart/merge:
    post:
      tags: [Cart]
      summary: Merge guest cart items into the authenticated user's cart
      description: >
        Merges identical product/variant lines and applies the merge atomically.
        Unavailable products or variants and stock conflicts reject the whole merge.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                        format: uuid
                      variantId:
                        type: string
                        format: uuid
                        nullable: true
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100
      responses:
        "200":
          description: The resulting cart after merge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItem"
        "404":
          description: Product or variant unavailable
        "409":
          description: Requested quantity exceeds available stock

  /cart/items/{id}:
    put:
      tags: [Cart]
      summary: Update cart item quantity by cart item ID
      description: The path ID is the cart item `id` returned by `GET /cart`, not a product or variant ID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        "200":
          description: Quantity updated
        "409":
          description: Item unavailable or out of stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Cart]
      summary: Remove item from cart
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item removed

  # ─── Orders ───
  /orders:
    get:
      tags: [Orders]
      summary: List current user's orders
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      tags: [Orders]
      summary: Place a new order (validates stock in a transaction)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, shippingAddress]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100
                      variantId:
                        type: string
                        format: uuid
                        nullable: true
                shippingAddress:
                  type: object
                  required: [country, city, address]
                  properties:
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    phone:
                      type: string
                    country:
                      type: string
                    city:
                      type: string
                    address:
                      type: string
                    postalCode:
                      type: string
                      maxLength: 50
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Items unavailable or out of stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /orders/{id}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel an unpaid pending order (restores stock)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  orderId:
                    type: string
                    format: uuid
        "409":
          description: Order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Payments ───
  /payments/initialize:
    post:
      tags: [Payments]
      summary: Initialize Paystack payment for an order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Reference and amount details for opening Paystack Inline checkout in the client
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                  amount:
                    type: integer
                    description: Amount in the minor currency unit (kobo for NGN)
                  currency:
                    type: string
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Order already paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Online payments are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payments/confirm:
    post:
      tags: [Payments]
      summary: Submit manual payment confirmation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, payerName, amount]
              properties:
                orderId:
                  type: string
                  format: uuid
                payerName:
                  type: string
                  minLength: 2
                  maxLength: 150
                amount:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                reference:
                  type: string
                  maxLength: 150
                notes:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Confirmation sent for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  confirmation:
                    $ref: "#/components/schemas/PaymentConfirmation"
        "404":
          description: Order not found or already paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Submitted amount does not match the order total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A manual payment confirmation is already awaiting review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payments/{reference}/verify:
    get:
      tags: [Payments]
      summary: Verify a payment by reference
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  paid:
                    type: boolean
                  orderId:
                    type: string
                    format: uuid
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payments/{reference}/cancel:
    post:
      tags: [Payments]
      summary: Cancel an unpaid payment attempt after checkout is closed
      security:
        - BearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment attempt cancelled
        "404":
          description: Payment not found
        "409":
          description: Payment or order can no longer be cancelled
        "409":
          description: Payment details do not match or the order is no longer payable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payments/webhook:
    post:
      tags: [Payments]
      summary: Paystack webhook endpoint (server-to-server)
      description: Paystack sends charge.success events here. Validates the x-paystack-signature header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed
        "401":
          description: Invalid signature
        "400":
          description: Invalid webhook payload

  # ─── Support ───
  /messages:
    post:
      tags: [Support]
      summary: Send a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, body]
              properties:
                name:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                body:
                  type: string
                  minLength: 3
                  maxLength: 3000
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
    get:
      tags: [Support]
      summary: List messages (admin only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    email:
                      type: string
                    body:
                      type: string
                    reply:
                      type: string
                      nullable: true
                    read:
                      type: boolean
                    archived:
                      type: boolean
                    created_at:
                      type: string
                      format: date-time

  # ─── Admin: Dashboard ───
  /admin/dashboard:
    get:
      tags: ["Admin: Dashboard"]
      summary: Dashboard analytics (sales, orders, customers, low stock)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  # ─── Admin: Products ───
  /admin/products:
    get:
      tags: ["Admin: Products"]
      summary: List all products (including inactive) with variants
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of products with sizes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSummary"
    post:
      tags: ["Admin: Products"]
      summary: Create a new product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryId, price, stock, sku, image]
              properties:
                name:
                  type: string
                  minLength: 2
                categoryId:
                  type: string
                  format: uuid
                description:
                  type: string
                price:
                  type: number
                  minimum: 0
                discountPrice:
                  type: number
                  nullable: true
                stock:
                  type: integer
                  minimum: 0
                sku:
                  type: string
                  minLength: 2
                brand:
                  type: string
                image:
                  type: string
                  nullable: true
                  description: Primary image URL, empty string, or null
                featured:
                  type: boolean
                newArrival:
                  type: boolean
                bestSeller:
                  type: boolean
                sizes:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name, stock]
                    properties:
                      name:
                        type: string
                      stock:
                        type: integer
                        minimum: 0
                      price:
                        type: number
                        nullable: true
                      sku:
                        type: string
                        minLength: 1
                images:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                    format: uri
                variants:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name, stock]
                    properties:
                      name:
                        type: string
                      options:
                        type: object
                        additionalProperties:
                          type: string
                      price:
                        type: number
                        minimum: 0
                        nullable: true
                      stock:
                        type: integer
                        minimum: 0
                      sku:
                        type: string
                        minLength: 1
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSummary"

  /admin/products/manage:
    get:
      tags: ["Admin: Products"]
      summary: List all products for management view
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of products with sizes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSummary"

  /admin/products/{id}:
    patch:
      tags: ["Admin: Products"]
      summary: Update a product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                categoryId:
                  type: string
                  format: uuid
                description:
                  type: string
                price:
                  type: number
                discountPrice:
                  type: number
                  nullable: true
                stock:
                  type: integer
                sku:
                  type: string
                brand:
                  type: string
                  nullable: true
                active:
                  type: boolean
                featured:
                  type: boolean
                newArrival:
                  type: boolean
                bestSeller:
                  type: boolean
                image:
                  type: string
                  nullable: true
                  description: Primary image URL, empty string, or null
                images:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                    format: uri
                sizes:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name, stock]
                    properties:
                      name:
                        type: string
                      stock:
                        type: integer
                        minimum: 0
                      price:
                        type: number
                        minimum: 0
                        nullable: true
                      sku:
                        type: string
                        minLength: 1
                variants:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name, stock]
                    properties:
                      name:
                        type: string
                      options:
                        type: object
                        additionalProperties:
                          type: string
                      price:
                        type: number
                        minimum: 0
                        nullable: true
                      stock:
                        type: integer
                        minimum: 0
                      sku:
                        type: string
                        minLength: 1
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSummary"
        "404":
          description: Product not found
    delete:
      tags: ["Admin: Products"]
      summary: Soft-delete a product (sets active=false)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Product deactivated
        "404":
          description: Product not found

  /admin/products/{id}/sizes:
    post:
      tags: ["Admin: Products"]
      summary: Add a size variant to a product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, stock]
              properties:
                name:
                  type: string
                  minLength: 1
                stock:
                  type: integer
                  minimum: 0
                price:
                  type: number
                  nullable: true
                sku:
                  type: string
      responses:
        "201":
          description: Size variant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"

  /admin/products/{id}/sizes/{variantId}:
    patch:
      tags: ["Admin: Products"]
      summary: Update a size variant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                options:
                  type: object
                  additionalProperties:
                    type: string
                price:
                  type: number
                  nullable: true
                stock:
                  type: integer
                  minimum: 0
                sku:
                  type: string
      responses:
        "200":
          description: Size variant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
    delete:
      tags: ["Admin: Products"]
      summary: Remove a size variant from a product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Size variant deactivated

  # ─── Admin: Orders ───
  /admin/orders:
    get:
      tags: ["Admin: Orders"]
      summary: List all orders with items and customer info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderWithItems"

  /admin/orders/{id}:
    patch:
      tags: ["Admin: Orders"]
      summary: Update order status and/or tracking number
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending_payment, paid, processing, shipped, delivered, cancelled, refunded]
                trackingNumber:
                  type: string
                  maxLength: 100
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ─── Admin: Payment Confirmations ───
  /admin/payment-confirmations:
    get:
      tags: ["Admin: Payment Confirmations"]
      summary: List all payment confirmations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of payment confirmations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentConfirmation"

  /admin/payment-confirmations/{id}:
    patch:
      tags: ["Admin: Payment Confirmations"]
      summary: Approve or reject a payment confirmation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
      responses:
        "200":
          description: Confirmation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "404":
          description: Confirmation not found

  # ─── Admin: Customers ───
  /admin/customers:
    get:
      tags: ["Admin: Customers"]
      summary: List all customers with spending totals
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

  /admin/customers/{id}/orders:
    get:
      tags: ["Admin: Customers"]
      summary: List a specific customer's orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of orders for the customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderWithItems"

  # ─── Admin: Staff ───
  /admin/staff:
    get:
      tags: ["Admin: Staff"]
      summary: List admin/owner staff members
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      tags: ["Admin: Staff"]
      summary: Create an admin account (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum: [admin, owner]
                  default: admin
      responses:
        "201":
          description: Staff account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "409":
          description: Email already exists or owner limit reached

  /admin/staff/{id}:
    delete:
      tags: ["Admin: Staff"]
      summary: Delete an admin account (owner only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Staff account deleted
        "409":
          description: Only admin accounts can be removed

  # ─── Admin: Categories ───
  /admin/categories:
    post:
      tags: ["Admin: Categories"]
      summary: Create a new category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  minLength: 2
                slug:
                  type: string
                  pattern: "^[a-z0-9-]+$"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    patch:
      tags: ["Admin: Categories"]
      summary: Update a category
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                active:
                  type: boolean
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      tags: ["Admin: Categories"]
      summary: Deactivate a category
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Category deactivated; products in this category are hidden from public catalog results

  # ─── Admin: Settings ───
  /admin/settings:
    get:
      tags: ["Admin: Settings"]
      summary: Get store settings (admin view)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
    put:
      tags: ["Admin: Settings"]
      summary: Replace store settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettings"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
