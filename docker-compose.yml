services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glow_market
      POSTGRES_USER: glowmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowmarket -d glow_market"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://glowmarket:${POSTGRES_PASSWORD}@db:5432/glow_market
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${PUBLIC_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
volumes:
  postgres_data:
