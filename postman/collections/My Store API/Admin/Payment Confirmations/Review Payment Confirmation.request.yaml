$kind: http-request
name: Review Payment Confirmation
method: PATCH
url: '{{baseUrl}}/api/admin/payment-confirmations/{{confirmationId}}'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "status": "approved"
    }
