$kind: http-request
name: Create Staff
method: POST
url: '{{baseUrl}}/api/admin/staff'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Staff Member",
      "email": "staff@example.com",
      "password": "password123",
      "role": "admin"
    }
