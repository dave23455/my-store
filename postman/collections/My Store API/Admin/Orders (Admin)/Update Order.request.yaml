$kind: http-request
name: Update Order
method: PATCH
url: '{{baseUrl}}/api/admin/orders/{{orderId}}'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "status": "shipped",
      "trackingNumber": "TRK123456"
    }
